services:
  # Minimal mode — FAISS + text search only (no CNN, no LLM)
  # Requires: data/processed/ populated (steps 1-3 of the README pipeline)
  app:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_USERNAME=${HF_USERNAME:-Grupo-Parquet-ITESO}
      - HF_SPACE_NAME=${HF_SPACE_NAME:-ProyectoFinal_recetas}
    command: python run_local.py --no-cnn --no-llm
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7860/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Full mode — CNN + LLM enabled
  # Requires: models/ populated with efficientnet_ingredients.pth and tinyllama-recipes-q4.gguf
  app-full:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_USERNAME=${HF_USERNAME:-Grupo-Parquet-ITESO}
      - HF_SPACE_NAME=${HF_SPACE_NAME:-ProyectoFinal_recetas}
    command: python run_local.py
    profiles:
      - full
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7860/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
