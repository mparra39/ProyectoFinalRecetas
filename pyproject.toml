[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recetas"
version = "0.1.0"
description = "Sistema multimodal de recomendación de recetas — ITESO Grupo Parquet"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.1",
    "pandas>=2.2.0",
    "pyarrow>=16.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "gradio==4.44.0",
    "huggingface-hub>=0.24,<1.0.0",
    "rapidfuzz>=3.9.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
train = [
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.49.0",
    "trl>=1.0.0",
    "sentencepiece",
    "sacremoses",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["recetas*"]
